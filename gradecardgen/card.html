    body {

    }

    * {

      font-size: inherit;
    }

    .cards {
      flex: 1;
      max-height: 95vh;
      overflow-y: scroll;
    }

    #grid_a,
    #grid_b {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background-color: black;
      gap: 1px;
      padding: 1px;
    }

    #grid_b {
      grid-template-rows: repeat(3, 1fr);
      grid-template-columns: repeat(8, 1fr);
    }

    #grid_a_a {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      background-color: black;
      gap: 1px;
    }

    #grid_b_a {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      background-color: black;
      gap: 1px;
    }

    #grid_b_b {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background-color: black;
      gap: 1px;
    }

    #grid_c {

      grid-template-columns: repeat(14, 1fr);
      grid-template-rows: repeat(5, 1fr);
      background-color: black;
      gap: 1px;
      padding: 1px;
    }

    .subgrid {
      display: grid;
      grid-template-columns: subgrid;
      grid-template-rows: subgrid;
    }

    .makeup_grids {
      display: grid;
      grid-template-columns: subgrid;
      grid-template-rows: subgrid;
      grid-column: 2 / -1;
    }

    #grid_d {
      display: grid;
      grid-template-columns: auto repeat(15, 1fr) 2fr repeat(16, 1fr) 2fr 2fr 2fr auto 2fr;
      grid-template-rows: 1fr 1fr 1fr 6fr;
      background-color: black;
      gap: 1px;
      padding: 1px;
    }

    input {
      border: none;
      text-align: center;
      min-width: 0;
    }

    span {
      background-color: white;
      text-align: center;
    }

    label {

      text-align: center;
      align-content: center;
      font-weight: bold;
    }

    .upright {

    }

    .row {

      border-color: black;
    }

      border-style: solid;
      border-width: 1px;
      border-color: black;
      flex: 1;
    }
  </style>
</head>

    <script>
      const form = document.querySelector(".form")
      
      const student_names = document.querySelector("#student_names")
      student_names.addEventListener("keyup", (evt) => {
        const key = evt.key.toLowerCase()

        /**@type {HTMLInputElement}*/
        const target = evt.target

        switch (key) {
          case "backspace":
            const p = target.parentElement

            //if removing this input would leave no inputs, skip
            if (p.childElementCount < 2) return

            //if target is empty, delete input
            if (target.value.trim().length > 1) return

            //remove this input
            target.remove()

            //focus last input
            p.lastElementChild.focus()

            break;
          case "enter":
            //if target is empty, skip
            if (target.value.trim().length < 1) return

            /**@type {HTMLInputELement}*/
            const last = target.parentNode.lastElementChild

            //if we're not talking about the last input, skip
            if (target !== last) {
              last.focus()
              return
            }

            //clone the input
            /**@type {HTMLInputElement}*/
            const n = target.cloneNode()

            //reset value of clone
            n.value = ""

            //append to parent
            target.parentElement.appendChild(n)

            //focus the new input
            n.focus()
            break;
        }

      })

      const cards = document.querySelector(".cards")

      const card = document.querySelector(".card")


      const class_code = document.querySelector("#class_code_input")
      const subject_code = document.querySelector("#subject_code_input")
      const subject_description = document.querySelector("#subject_description_input")
      const subject_hours_input = document.querySelector("#subject_hours_input")
      const dates_start_input = document.querySelector("#dates_start_input")
            const dates_end_input = document.querySelector("#dates_end_input")


      function getStudentNames() {
        const results = []
        for (const ch of student_names.children) {
          /**@type {HTMLInputElement}*/
          const ich = ch
          const v = ich.value.trim()
          if (v.length < 1) break
          results.push(v)
        }
        return results
      }

      const generate = document.querySelector("#generate")
      generate.addEventListener("click", () => {
        const names = getStudentNames()
        if (names.length < 1) return

        cards.replaceChildren()

        for (const name of names) {
          /**@type {HTMLDivElement}*/
          const n = card.cloneNode(true)
          n.style.display = "unset"

          n.querySelector("#student_name_input").value = name
          n.querySelector("#subject_code_input").value = subject_code.value
          n.querySelector("#class_code_input").value = class_code.value
          n.querySelector("#subject_description_input").value = subject_description.value
          n.querySelector("#subject_hours_input").value = subject_hours_input.value
          n.querySelector("#dates_start_input").value = dates_start_input.value
          n.querySelector("#dates_end_input").value = dates_end_input.value

          cards.appendChild(n)
        }

      })
